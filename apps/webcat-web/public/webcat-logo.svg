<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none">
  <!-- Shield background -->
  <path d="M64 8L118 32V64C118 88 100 110 64 120C28 110 10 88 10 64V32L64 8Z" fill="#0d1117" stroke="#58a6ff" stroke-width="2.5"/>
  <!-- Cat head silhouette -->
  <g transform="translate(64,58)">
    <!-- Ears -->
    <path d="M-20 -22L-10 -38L-2 -22" fill="#58a6ff"/>
    <path d="M20 -22L10 -38L2 -22" fill="#58a6ff"/>
    <!-- Head -->
    <ellipse cx="0" cy="-8" rx="22" ry="18" fill="#58a6ff"/>
    <!-- Eyes -->
    <ellipse cx="-8" cy="-10" rx="5" ry="5.5" fill="#0d1117"/>
    <ellipse cx="8" cy="-10" rx="5" ry="5.5" fill="#0d1117"/>
    <!-- Eye highlights -->
    <circle cx="-6" cy="-12" r="1.5" fill="#fff" opacity="0.7"/>
    <circle cx="10" cy="-12" r="1.5" fill="#fff" opacity="0.7"/>
    <!-- Nose -->
    <path d="M-2 -5L0 -3L2 -5" fill="#0d1117"/>
    <!-- Whiskers -->
    <line x1="-24" y1="-4" x2="-10" y2="-3" stroke="#58a6ff" stroke-width="1" stroke-linecap="round"/>
    <line x1="-24" y1="-1" x2="-10" y2="-1" stroke="#58a6ff" stroke-width="1" stroke-linecap="round"/>
    <line x1="24" y1="-4" x2="10" y2="-3" stroke="#58a6ff" stroke-width="1" stroke-linecap="round"/>
    <line x1="24" y1="-1" x2="10" y2="-1" stroke="#58a6ff" stroke-width="1" stroke-linecap="round"/>
    <!-- Mouth -->
    <path d="M-4 2L0 5L4 2" fill="none" stroke="#0d1117" stroke-width="1.2" stroke-linecap="round"/>
  </g>
  <!-- Terminal cursor at bottom -->
  <rect x="48" y="98" width="32" height="3" rx="1" fill="#58a6ff" opacity="0.6"/>
</svg>
