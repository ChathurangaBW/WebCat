engagement:
  id: example-engagement
  name: Authorized Example Assessment
  authorization_confirmed: false
  authorization_reference: ""
  mode: manual
  allow:
    - id: example-app
      scheme: https
      host: app.example.test
      port: 443
      path_prefix: /
  deny:
    - id: destructive-reset
      scheme: https
      host: app.example.test
      path_prefix: /admin/reset
